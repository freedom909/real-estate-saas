schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.11"
    import: ["@key", "@shareable", "@external"]
  ) {
  query: Query
  mutation: Mutation
}

scalar DateTime

enum TenantStatus {
  ACTIVE
  SUSPENDED
  DELETED
}

enum MembershipRole {
  OWNER
  ADMIN
  MEMBER
}

enum MembershipStatus {
  ACTIVE
  INVITED
  SUSPENDED
  REMOVED
}

extend type User @key(fields: "id") {
  id: ID! @external
}

# =========================
# Tenant
# =========================

type Tenant @key(fields: "id") {
  id: ID!
  name: String!
  slug: String!
  status: TenantStatus!
  owner: User!
  memberships: [Membership!]!
  createdAt: DateTime
  updatedAt: DateTime
}

# =========================
# Membership
# =========================

type Membership @key(fields: "id") {
  id: ID!
  tenant: Tenant!
  user: User!
  role: MembershipRole!
  status: MembershipStatus!
  createdAt: DateTime
  updatedAt: DateTime
}

# =========================
# Pagination
# =========================

type PageInfo {
  total: Int!
  hasNextPage: Boolean!
}

type TenantConnection {
  items: [Tenant!]!
  pageInfo: PageInfo!
}

type MembershipConnection {
  items: [Membership!]!
  pageInfo: PageInfo!
}

# =========================
# Inputs
# =========================

input CreateTenantInput {
  name: String!
  slug: String!
}

input UpdateTenantInput {
  name: String!
}

input TenantFilterInput {
  keyword: String
  status: TenantStatus
  limit: Int
  offset: Int
}

input CreateMembershipInput {
  tenantId: ID!
  userId: ID!
  role: MembershipRole!
}

input UpdateMembershipInput {
  role: MembershipRole
  status: MembershipStatus
}

input MembershipFilterInput {
  tenantId: ID!
  userId: ID
  role: MembershipRole
  status: MembershipStatus
  limit: Int
  offset: Int
}

# =========================
# Query
# =========================

type Query {
  getTenant(id: ID!): Tenant

  getTenants(
    filter: TenantFilterInput
  ): TenantConnection!

  getMembership(id: ID!): Membership

  getMemberships(
    filter: MembershipFilterInput!
  ): MembershipConnection!

  getMyTenants: [Tenant!]!

  getMyMembership(
    tenantId: ID!
  ): Membership
}

# =========================
# Mutation
# =========================

type Mutation {
  createTenant(
    input: CreateTenantInput!
  ): Tenant!

  updateTenant(
    id: ID!
    input: UpdateTenantInput!
  ): Tenant!

  suspendTenant(
    id: ID!
  ): Tenant!

  switchTenant(
    tenantId: ID!
  ): SwitchTenantPayload!

  createMembership(
    input: CreateMembershipInput!
  ): Membership!

  updateMembership(
    id: ID!
    input: UpdateMembershipInput!
  ): Membership!

  removeMembership(
    id: ID!
  ): Membership!
}

# =========================
# Switch Tenant
# =========================

type SwitchTenantPayload {
  tenant: Tenant!
  activeTenantId: ID!
}