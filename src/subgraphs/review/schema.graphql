schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.11"
    import: ["@key", "@external"]
  ) {
  query: Query
  mutation: Mutation
}

# =========================================================
# Scalars
# =========================================================

scalar DateTime

# =========================================================
# Query
# =========================================================

type Query {

  searchReviews(
    input: SearchReviewsInput!
  ): [Review!]!


  reviewsForListing(
    listingId: ID!
  ): [Review!]!


  review(
    id: ID!
  ): Review

  allReviews: [Review!]!
}

# =========================================================
# Mutation
# =========================================================

type Mutation {

  submitCustomerReview(
    customerReview: ReviewInput!
    bookingId: ID!
  ): SubmitCustomerReviewResponse!


  submitOwnerReplyToCustomerReview(
    bookingId: ID!
    hostReview: ReviewInput!
    customerReviewID: ID!
    comment: CommentInput!
  ): SubmitOwnerReplyToCustomerReviewResponse!
}

# =========================================================
# Review
# =========================================================

type Review @key(fields:"id") {
  id: ID!
  content: String!
  rating: Float!
  author: User!
  booking: Booking!
  location: Location
  customer: User
  host: User
  
  likes: [Like!]!
  dislikes: [Like!]!
  comments: [Comment!]!
  round: Int!
  isPinned: Boolean!
  isRecommended: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# =========================================================
# Like
# =========================================================

type Like {
  id: ID!

  userId: ID!

  reviewId: ID!

  createdAt: DateTime!

  updatedAt: DateTime!

  isPositive: Boolean!
}

# =========================================================
# Comment
# =========================================================

type Comment {
  id: ID!

  content: String!

  author: User!

  review: Review

  createdAt: DateTime!

  updatedAt: DateTime!
}

# =========================================================
# Location
# =========================================================

extend type Location @key(fields: "id") {
  id: ID! @external
}

# =========================================================
# Owner
# =========================================================

# =========================================================
# Customer
# =========================================================


# =========================================================
# Booking Reference
# =========================================================


extend type Booking @key(fields: "id") {
  id: ID! @external
}

# =========================================================
# Listing Reference
# =========================================================


extend type Listing @key(fields: "id") {
  id: ID! @external
}

# =========================================================
# User Reference
# =========================================================


extend type User @key(fields: "id") {
  id: ID! @external
}

# =========================================================
# Enums
# =========================================================

enum ReviewSortField {
  RATING
  CREATED_AT
  UPDATED_AT
}

enum Role {
  GUEST
  CUSTOMER
  STAFF
  MODERATOR
  HOST
  AGENT
  OWNER
  ADMIN
  SUPER_ADMIN
}

enum SortOrder {
  ASC
  DESC
}

# =========================================================
# Search Input
# =========================================================

input SearchReviewsInput {
  id: ID

  customerId: ID

  authorId: ID

  listingId: ID

  ownerId: ID

  targetType: String

  content: String

  rating: Float

  round: Int

  isPinned: Boolean

  isRecommended: Boolean

  limit: Int

  offset: Int

  sortBy: ReviewSortField

  sortOrder: SortOrder
}

# =========================================================
# Review Input
# =========================================================

input ReviewInput {
  content: String!

  rating: Float!

  locationId: ID

  customerId: ID

  bookingId: ID

  round: Int!

  ownerId: ID
}

# =========================================================
# Comment Input
# =========================================================

input CommentInput {
  content: String!
}

# =========================================================
# Mutation Response Interface
# =========================================================

interface MutationResponse {
  code: Int!

  success: Boolean!

  message: String!
}

# =========================================================
# Submit Customer Review Response
# =========================================================

type SubmitCustomerReviewResponse  implements MutationResponse {

  bookingId: ID!

  customerReview: String

  code: Int!

  success: Boolean!

  message: String!
}

# =========================================================
# Submit Owner Reply Response
# =========================================================

type SubmitOwnerReplyToCustomerReviewResponse implements MutationResponse {

  code: Int!

  success: Boolean!

  message: String!

  customerReviewID: ID

  ownerReview: Review!

  locationReview: Review
}