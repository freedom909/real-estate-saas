name: Deploy Frontend → Cloudflare Pages (next-on-pages)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Cloudflare Pages · next-on-pages
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check required secrets
        id: check-secrets
        run: |
          missing=()
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::notice title=Skip Cloudflare Pages deploy::Missing repo secrets: ${missing[*]}. Add them to GitHub repo → Settings → Secrets and variables → Actions before enabling this workflow."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci;
          else npm install && echo "::warning title=package-lock missing::Generated a new lockfile — commit it for reproducible CI";
          fi

      - name: Inject Pages build-time environment
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          cp .env.example .env.production.local 2>/dev/null || true
          {
            echo "NEXT_PUBLIC_GATEWAY_URL=${{ vars.NEXT_PUBLIC_GATEWAY_URL || 'https://api.minshuku.info/graphql' }}"
            echo "NEXT_PUBLIC_APP_ENV=production"
            echo "AUTH_GRAPHQL_ENDPOINT=${{ vars.AUTH_GRAPHQL_ENDPOINT || 'https://api.minshuku.info/graphql' }}"
          } >> .env.production.local

      - name: Build Next 16 for Cloudflare Pages (next-on-pages)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          NEXT_PUBLIC_GATEWAY_URL: ${{ vars.NEXT_PUBLIC_GATEWAY_URL || 'https://api.minshuku.info/graphql' }}
          AUTH_GRAPHQL_ENDPOINT: ${{ vars.AUTH_GRAPHQL_ENDPOINT || 'https://api.minshuku.info/graphql' }}
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages (production)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'minshuku-frontend' }}
          directory: .vercel/output/static
          wranglerVersion: "3"
          workingDirectory: frontend
