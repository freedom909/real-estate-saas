name: Deploy (Backend)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check for Railway token
        id: check-token
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RAILWAY_TOKEN secret not configured — skipping backend deployment"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Checkout repository
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-token.outputs.has_token == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Install Railway CLI
        if: steps.check-token.outputs.has_token == 'true'
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        if: steps.check-token.outputs.has_token == 'true'
        run: railway up --service backend --project bb75c99e-082e-4f2f-b4d6-e2784b5759ac --environment production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        timeout-minutes: 15
