name: Deploy Frontend (Vercel)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check for Vercel token + project/org IDs
        id: check-tokens
        run: |
          ok=true
          [ -n "$VERCEL_TOKEN" ] || ok=false
          [ -n "$VERCEL_ORG_ID" ] || ok=false
          [ -n "$VERCEL_PROJECT_ID" ] || ok=false
          if [ "$ok" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) not all configured — skipping frontend deployment"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Checkout repository
        if: steps.check-tokens.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: steps.check-tokens.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.check-tokens.outputs.ready == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Deploy to Vercel (production)
        if: steps.check-tokens.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'
        timeout-minutes: 15
